<style>
/* Layout: fixed full-width header + collapsible sidebar + scrolling content; teal on cool slate, data first */
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#0D9488; --accent-ink:#FFFFFF; --accent-soft:#E6F6F4; --accent-t:#0F766E;
  --warn:#F59E0B; --bad:#E11D48; --good:#059669; --good-t:#047857; --warn-t:#B45309; --bad-t:#BE123C;
  --land:#EEF3F6; --target:#CBD5E1; --hover:#F1F5F9;
  --c1:#0D9488; --c2:#D97706; --c3:#7C3AED; --c4:#DB2777;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --card:#111A2B; --fg:#E6EDF7; --muted:#94A3B8; --line:#22304A; --line2:#334564;
  --accent:#2DD4BF; --accent-ink:#04201D; --accent-soft:#0F3430; --accent-t:#5EEAD4;
  --warn:#FBBF24; --bad:#FB7185; --good:#34D399; --good-t:#34D399; --warn-t:#FBBF24; --bad-t:#FB7185;
  --land:#16233A; --target:#3A4B69; --hover:#18233A;
  --c1:#2DD4BF; --c2:#FBBF24; --c3:#A78BFA; --c4:#F472B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#111A2B; --fg:#E6EDF7; --muted:#94A3B8; --line:#22304A; --line2:#334564;
  --accent:#2DD4BF; --accent-ink:#04201D; --accent-soft:#0F3430; --accent-t:#5EEAD4;
  --warn:#FBBF24; --bad:#FB7185; --good:#34D399; --good-t:#34D399; --warn-t:#FBBF24; --bad-t:#FB7185;
  --land:#16233A; --target:#3A4B69; --hover:#18233A;
  --c1:#2DD4BF; --c2:#FBBF24; --c3:#A78BFA; --c4:#F472B6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(56px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--card)}
.ibtn{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ibtn:hover{background:var(--hover)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand div{min-width:0}
.grow{flex:1}
.prof{position:relative}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;border:0;display:grid;place-items:center;font-size:13px}
.pmenu{position:absolute;right:0;top:44px;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(2,6,23,.18);padding:6px;z-index:40}
.pmenu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pmenu .who b{display:block}
.pmenu .who span{color:var(--muted);font-size:12.5px}
.pmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px}
.pmenu button:hover{background:var(--hover)}

/* sidebar */
.side{position:fixed;z-index:25;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;left:0;width:240px;background:var(--card);border-right:1px solid var(--line);
  padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow-y:auto;transform:translateX(-102%);transition:transform .2s}
body.nav-open .side{transform:none}
.scrim{display:none;position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.45)}
.ngrp{margin:0 0 16px}
.ngrp h3{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--fg);font-weight:500}
.nitem:hover{background:var(--hover)}
.nitem.on{background:var(--accent-soft);color:var(--accent-t);font-weight:600}
.nitem svg{flex:none}

/* main */
.main{padding-top:72px;padding-bottom:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){body.nav-open .main{margin-left:240px}}
@media (max-width:899px){body.nav-open .scrim{display:block}}
.ptitle{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.ptitle h1{font-size:24px}
.ptitle p{margin:2px 0 0;color:var(--muted)}
.demo{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent-t);border-radius:8px;padding:8px 12px;font-size:12.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.cardh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.cardh h2{font-size:16px}
.cardh span{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
@media (max-width:1050px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* controls */
.fbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
select,input[type=text],input[type=password],input[type=number],input[type=date]{height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:0 10px;min-width:0;max-width:100%}
select:disabled,input:disabled{background:var(--hover);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:0 12px;height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.dng{color:var(--bad-t);border-color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent-t);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.fgrid .fld select,.fgrid .fld input{width:100%}
.hint{color:var(--muted);font-size:12.5px;margin:0}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,.tl{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
tfoot td{font-weight:700;border-top:2px solid var(--line2)}
tr.kr:hover td{background:var(--hover)}
.lnk{background:none;border:0;padding:0;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chev{transition:transform .15s;color:var(--muted)}
.open .chev{transform:rotate(90deg)}
tr.ex>td{background:var(--bg);padding:10px 10px 14px 34px;white-space:normal}
.mini th{background:var(--bg)}
.mini{font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-t)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn-t)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad-t)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* bars */
.krows{display:flex;flex-direction:column;gap:7px;max-height:560px;overflow-y:auto;padding-right:4px}
.krow{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) minmax(96px,150px);gap:10px;align-items:center;font-size:13px}
.krow .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .kv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ktrack{position:relative;height:12px;border-radius:3px;background:var(--hover)}
.kfill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.ktick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
@media (max-width:520px){.krow{grid-template-columns:minmax(80px,110px) minmax(0,1fr)}.krow .kv{grid-column:1/-1;text-align:left;margin-top:-4px}}
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center}

/* input per kelompok */
.fform{display:flex;flex-direction:column;gap:16px}
.kgrp{border:1px solid var(--line);border-radius:10px;padding:10px 14px 14px;margin:0;min-width:0}
.kgrp legend{padding:0 8px;font-weight:700;font-family:var(--f-display);font-size:15px;display:flex;align-items:center}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 14px}
.kit{display:flex;flex-direction:column;gap:4px;min-width:0}
.kit>span:first-child{font-size:12.5px;font-weight:600}
.kin{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--card);height:38px;overflow:hidden}
.kin input{border:0;height:100%;flex:1;min-width:0;padding:0 10px;background:transparent;text-align:right;border-radius:0}
.kin input:focus-visible{outline:none}
.kin:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.kin.bad{border-color:var(--bad)}
.kin em{font-style:normal;color:var(--muted);padding:0 10px;font-size:12.5px;background:var(--hover);height:100%;display:grid;place-items:center}
.actbar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--card);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.atot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.atot span,.atot small{color:var(--muted);font-size:12.5px}
.atot b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.abtns{display:flex;gap:8px}
tr.grp td{background:var(--hover);font-weight:700}
.ind{display:inline-block;width:16px}
table.wide th:first-child,table.wide td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
table.wide tr.kr:hover td:first-child{background:var(--hover)}
.modal .stack select{width:100%}
#tip{position:fixed;z-index:80;pointer-events:none;background:#0F172A;color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#tip b{color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#0F172A;color:#fff;padding:10px 16px;border-radius:8px;font-weight:500;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.bad{background:#BE123C}

.modalbg{position:fixed;inset:0;z-index:70;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,100%);max-height:calc(100% - 16px);overflow:auto}
.modal h2{font-size:18px;margin-bottom:12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal textarea{width:100%;height:200px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.modal .stack{display:flex;flex-direction:column;gap:12px}
.modal .stack input{width:100%}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-left,0px))}
.lcard{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
.lcard h1{font-size:28px}
.lcard .fld input{width:100%}
.err{color:var(--bad-t);font-size:13px;margin:0}
.sep{border:0;border-top:1px solid var(--line);margin:0}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick select{flex:1;min-width:140px}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function persist(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function defaultUsers(){
  var u=[{username:'provinsi',kab:'*',role:'provinsi',hash:hash('provinsi123')}];
  KABN.forEach(function(n){u.push({username:slug(n),kab:n,role:'kabupaten',hash:hash(DEFAULT_PW)});});
  return u;
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedData(){
  var r=rng(20261101), n=0;
  var KF={'Cabai Rawit':40,'Cabai Keriting':25,'Cabai Besar':15,'Bawang Merah':30,'Bawang Putih':6,'Tomat':20,'Jeruk':50,'Durian':25,'Mangga':45,'Pisang':90,'Melon':10,'Semangka':14,'Alpukat':12,'Kunyit':12,'Jahe':10,'Sereh':4};
  var d={laporan:[],panen:[],target:[],users:defaultUsers()};
  KAB.forEach(function(k){
    var size=0.45+r()*1.7;
    KOM.forEach(function(kom){
      if(r()>0.7)return;
      for(var m=1;m<=12;m++){
        var tgt=r2(size*KF[kom]*(0.85+r()*0.3));
        d.target.push({id:'T|'+m+'|'+k.n+'|'+kom,bulan:m,kab:k.n,kom:kom,ha:tgt});
        if(m>NOWM)continue;
        [['laporan',0.55+r()*0.6],['panen',0.35+r()*0.5]].forEach(function(p){
          var cnt=m<NOWM?1:2, ratio=p[1]*(m===NOWM?Math.min(1,NOWD/28):1);
          for(var i=0;i<cnt;i++){
            var day=m===NOWM?Math.max(1,NOWD-Math.floor(r()*r()*NOWD*0.9)):1+Math.floor(r()*dim(YEAR,m));
            var kec=k.kec[Math.floor(r()*k.kec.length)];
            d[p[0]].push({id:'S'+(++n),tanggal:YEAR+'-'+pad(m)+'-'+pad(day),kab:k.n,kec:kec,kom:kom,ha:r2(tgt*ratio/cnt*(0.7+r()*0.6)),by:slugOf(k.n),ts:n});
          }
        });
      }
    });
  });
  return d;
}
function slugOf(n){return slug(n);}
function loadLocal(){
  var raw=null;try{raw=localStorage.getItem(LS);}catch(e){}
  if(raw){try{var j=JSON.parse(raw);if(j&&j.laporan&&j.users){DB=j;return;}}catch(e){}}
  DB=seedData();persist();
}
function remote(p){
  if(!APPS_SCRIPT_URL)return;
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).catch(function(){toast('Gagal menyimpan ke Google Sheets','bad');});
}
function remoteLoad(){
  return fetch(APPS_SCRIPT_URL+'?action=all').then(function(r){return r.json();}).then(function(j){
    DB.laporan=(j.laporan||[]).map(function(x){x.tanggal=normDate(x.tanggal);x.ha=+x.ha;return x;});
    DB.panen=(j.panen||[]).map(function(x){x.tanggal=normDate(x.tanggal);x.ha=+x.ha;return x;});
    DB.target=(j.target||[]).map(function(x){x.bulan=+x.bulan;x.ha=+x.ha;return x;});
    DB.users=j.users||[];
    if(!DB.users.length){DB.users=defaultUsers();DB.users.forEach(function(u){remote({action:'upsert',sheet:'Users',row:u});});}
  });
}

function komChart(m,cats,cap,tg){

function dayChart(counts,days,sel){
  var W=640,H=200,L=34,B=28,T=10,R=6,mx=niceMax(Math.max.apply(null,counts.concat([1]))),bw=(W-L-R)/days;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Jumlah entri laporan per hari">';
  for(var i=0;i<=4;i++){var y=T+(H-T-B)*(1-i/4);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+nf1.format(mx*i/4)+'</text>';}
  counts.forEach(function(v,i){
    var h=(H-T-B)*v/mx,x=L+bw*i+bw*0.15;
    s+='<g data-tip="'+esc('Tanggal '+(i+1)+'|'+v+' entri')+'"><rect x="'+x.toFixed(1)+'" y="'+(H-B-h).toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" fill="'+(i+1===sel?'var(--accent)':'color-mix(in srgb,var(--accent) 45%,transparent)')+'"/><rect x="'+(L+bw*i).toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+(H-T-B)+'" fill="transparent"/></g>';
    if((i+1)%5===0||i===0)s+='<text x="'+(L+bw*i+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+(i+1)+'</text>';
  });
  return s+'</svg>';
}

function cn(v){return (Math.round((+v||0)*100)/100).toFixed(2).replace('.',',');}
function csvQ(v){v=String(v==null?'':v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

function csvOut(name,rows){
  var text=csvText(rows);
  if(!DL){
    try{var bl=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);toast('Berkas '+name+' diunduh');}catch(e){csvModal(name,text);}
    return;
  }

function exportKab(m){
  var c=M[m],D=tabData(m),CL=cols(),out=csvHead('Tabulasi '+c.name+' ('+c.full+') per Kabupaten/Kota');
  var hd=['No','Kabupaten/Kota'].concat(CL.map(function(x){return x.l+' (ha)';}),['Total (ha)']);
  if(c.tgt)hd=hd.concat(['Target (ha)','Capaian (%)']);
  out.push(hd);
  var tot={},gt=0,gtt=0;
  D.kabs.forEach(function(n,i){
    var o=D.cap[n]||{},t=sum(CL,function(x){return o[x.k]||0;}),tt=D.tK[n]||0;
    CL.forEach(function(x){tot[x.k]=(tot[x.k]||0)+(o[x.k]||0);});gt+=t;gtt+=tt;
    out.push([i+1,kabLabel(n)].concat(CL.map(function(x){return cn(o[x.k]);}),[cn(t)],c.tgt?[cn(tt),tt>0?cn(t/tt*100):'']:[]));
  });
  out.push(['','Total'].concat(CL.map(function(x){return cn(tot[x.k]);}),[cn(gt)],c.tgt?[cn(gtt),gtt>0?cn(gt/gtt*100):'']:[]));
  csvOut(csvName(c,'Kabupaten'),out);
}
function exportKec(m){
  var c=M[m],D=tabData(m),CL=cols(),out=csvHead('Tabulasi '+c.name+' ('+c.full+') per Kecamatan');
  out.push(['No','Kabupaten/Kota','Kecamatan'].concat(CL.map(function(x){return x.l+' (ha)';}),['Total (ha)']));
  var tot={},gt=0,no=0;
  D.kabs.forEach(function(n){
    var kc=D.kc[n]||{};
    kabInfo(n).kec.slice().sort().forEach(function(e){
      var x=kc[e]||{},t=sum(CL,function(y){return x[y.k]||0;});
      CL.forEach(function(y){tot[y.k]=(tot[y.k]||0)+(x[y.k]||0);});gt+=t;
      out.push([++no,kabLabel(n),e].concat(CL.map(function(y){return cn(x[y.k]);}),[cn(t)]));
    });
  });
  out.push(['','Total',''].concat(CL.map(function(y){return cn(tot[y.k]);}),[cn(gt)]));
  csvOut(csvName(c,'Kecamatan'),out);
}

  var a=$('#ftot'),b=$('#fcnt');if(a)a.textContent=f2(t)+' ha';if(b)b.textContent=n+' komoditas';
});
document.addEventListener('submit',function(e){
  var f=e.target.getAttribute('data-form');if(!f)return;e.preventDefault();
  if(f==='login')login($('#lu').value,$('#lp').value);
  else if(f==='entry')saveEntry(mod());
  else if(f==='edit')saveEdit(mod(),e.target.getAttribute('data-id'));
  else if(f==='pw'){
    var o=$('#pw0').value,n1=$('#pw1').value,n2=$('#pw2').value,er=$('#pwe');
    if(hash(o)!==S.user.hash){er.textContent='Password saat ini tidak cocok.';return;}
    if(n1.length<6){er.textContent='Password baru minimal 6 karakter.';return;}
    if(n1!==n2){er.textContent='Ulangi password baru dengan teks yang sama.';return;}
    S.user.hash=hash(n1);DB.users.forEach(function(u){if(u.username===S.user.username)u.hash=S.user.hash;});persist();remote({action:'upsert',sheet:'Users',row:S.user});closeModal();toast('Password diperbarui');
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();var pm=$('#pmenu');if(pm)pm.hidden=true;}});
document.addEventListener('mouseover',function(e){var t=e.target.closest('[data-tip]');if(t&&!window.matchMedia('(hover:none)').matches)showTip(t,e);});
document.addEventListener('mousemove',function(e){var t=e.target.closest('[data-tip]');if(t&&!window.matchMedia('(hover:none)').matches&&!$('#tip').hidden)showTip(t,e);});
document.addEventListener('mouseout',function(e){if(e.target.closest('[data-tip]'))$('#tip').hidden=true;});
window.addEventListener('scroll',function(){$('#tip').hidden=true;},{passive:true});

var DL=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(function(d){DL=d;}).catch(function(){});}catch(e){}
function boot(){
  var un=null;try{un=localStorage.getItem(LS+'-user');}catch(e){}
  if(un){var x=DB.users.filter(function(u){return u.username===un;})[0];if(x){S.user=x;S.nav=window.matchMedia('(min-width:900px)').matches;}}
  applyNav();render();
}
if(APPS_SCRIPT_URL){
  app.innerHTML='<div class="login"><p class="hint">Memuat data dari Google Sheets…</p></div>';
  remoteLoad().then(boot).catch(function(){app.innerHTML='<div class="login"><p class="err">Data tidak dapat dimuat dari Google Sheets. Periksa APPS_SCRIPT_URL.</p></div>';});
}else{loadLocal();boot();}
})();
